<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>文件中转站 · Gemos</title><link rel="stylesheet" href="./transfer.css"></head>
<body><main><nav><a href="/" class="brand">Gemos<span>.</span></a><span>私人文件中转站</span><button id="logout" hidden>退出登录 ↗</button></nav>
<header><p class="eyebrow">A LITTLE SPACE BETWEEN DEVICES</p><h1>放在这里。<br><span>换台设备，接着用。</span></h1><p class="intro">文件暂存 5 天，随时取走。到期自动删除。</p></header>
<section id="login-panel" class="login-panel"><div class="login-icon" aria-hidden="true">↗</div><div><h2>你的临时收纳处</h2><p>使用网站后台口令，在任意设备打开同一个中转站。</p><form id="login-form"><label for="password">访问口令</label><div class="login-row"><input id="password" type="password" autocomplete="current-password" required placeholder="输入后台口令"><button class="primary" id="login-button">进入中转站 <span aria-hidden="true">→</span></button></div></form></div></section>
<section id="workspace" hidden><div class="upload-area" id="dropzone"><div class="upload-symbol" aria-hidden="true">↑</div><h2>把文件放进来</h2><p>拖到这里，或从设备中选择。支持任意文件类型。</p><label class="primary file-button">选择文件 <span aria-hidden="true">＋</span><input id="files" type="file" multiple></label><span class="upload-note">单文件最多 1 GB · 文件夹请先压缩</span></div>
<div id="queue" hidden aria-live="polite"><div class="queue-title"><strong id="queue-label"></strong><button id="cancel">取消上传</button></div><progress id="progress" value="0" max="100"></progress><p id="queue-detail"></p></div>
<div class="library-head"><div><p class="eyebrow">YOUR TEMPORARY SHELF</p><h2>等你取走</h2></div><button id="refresh">刷新列表 ↻</button></div><div class="library-tools"><label class="search-label"><span class="sr-only">搜索文件</span><input id="search" type="search" placeholder="搜索文件名…"></label><span id="capacity"></span></div>
<div id="file-list"></div><p id="empty" class="empty" hidden>这里暂时空着。<br><span>上传一份文件，下一台设备就能看见。</span></p></section>
<p id="message" role="status" hidden></p><footer><span>Gemos / Transfer</span><span>完成上传后保留 120 小时 · 到期不可下载</span></footer></main><script type="module" src="./transfer.js"></script></body></html>
