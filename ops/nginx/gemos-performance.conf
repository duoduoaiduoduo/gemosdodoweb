# Included inside the existing gemosdodo.art server block.
# The deployment creates gzip companions without changing public URLs.
gzip_static on;
gzip_vary on;
gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/wasm;

# Vite filenames are content-hashed; unchanged revisits need no download.
location ^~ /assets/ {
    try_files $uri =404;
    include /www/server/nginx/conf/mime.types;
    types { application/javascript mjs; }
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
}

# HTML and release markers must reflect the latest publication.
location = /deployment.json {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
}
location ~* ^/(?!\.|LICENSE|README\.md|api/|uploads/|models/|downloads/).+\.html$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
}

# Public scripts keep conditional caching while receiving correct module MIME.
# Exclude API, uploaded user content and the dedicated model/download aliases.
location ~* ^/(?!\.|LICENSE|README\.md|api/|uploads/|models/|downloads/).+\.(?:js|mjs|css|wasm)$ {
    try_files $uri =404;
    include /www/server/nginx/conf/mime.types;
    types { application/javascript mjs; }
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
}
