<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<style>
  :root {
    --paper: #F6F5F1;
    --paper-2: #FBFAF7;
    --ink: #1c1a17;
    --ink-soft: #6b665e;
    --ink-faint: #9a948a;
    --accent: #E07B00;
    --accent-soft: #f4e6d2;
    --line: #e5e1d8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  @page { size: A4; margin: 0; }

  html, body {
    font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    width: 210mm;
    height: 297mm;
  }

  .page {
    position: relative;
    width: 210mm;
    height: 297mm;
    background: var(--paper);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    page-break-after: avoid;
    break-after: avoid;
  }

  /* ---- full-bleed banner ---- */
  .banner {
    position: relative;
    width: 210mm;
    height: 92mm;
    flex-shrink: 0;
    overflow: hidden;
  }
  .banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 46%;
    display: block;
  }
  /* ---- body content ---- */
  .inner {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 6mm 24mm 22mm;
  }

  /* kicker directly under banner */
  .kicker {
    display: flex;
    align-items: center;
    gap: 3mm;
    font-size: 9.5pt;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
  }
  .kicker .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .kicker .rule { flex: 1; height: 1px; background: var(--line); }

  /* lead line */
  .lead {
    margin-top: 9mm;
    font-size: 15pt;
    color: var(--ink-soft);
    line-height: 1.55;
    font-weight: 400;
  }
  .lead b { color: var(--ink); font-weight: 700; }

  /* big statement */
  .statement {
    margin-top: 11mm;
    font-size: 21pt;
    font-weight: 300;
    line-height: 1.42;
    letter-spacing: 0.01em;
    color: var(--ink);
  }
  .statement em { font-style: normal; color: var(--accent); font-weight: 600; }

  /* section label */
  .sec-label {
    margin-top: 13mm;
    margin-bottom: 6mm;
    font-size: 9pt;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 3mm;
  }
  .sec-label .rule { flex: 1; height: 1px; background: var(--line); }

  /* rooms grid */
  .rooms {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 12mm;
    row-gap: 0;
  }
  .room {
    display: flex;
    align-items: baseline;
    gap: 4mm;
    padding: 3.4mm 0;
    border-bottom: 1px solid var(--line);
  }
  .room .cidx {
    font-size: 8.5pt;
    color: var(--ink-faint);
    font-weight: 600;
    width: 7mm;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .room .cname {
    font-size: 12.5pt;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
  }
  .room .cpath {
    margin-left: auto;
    font-size: 9pt;
    color: var(--accent);
    font-weight: 500;
    font-family: 'SF Mono', ui-monospace, monospace;
  }

  /* footer / CTA */
  .foot {
    margin-top: auto;
    padding-top: 12mm;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 10mm;
  }
  .foot-left { flex: 1; }
  .foot-eyebrow {
    font-size: 9pt;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
    margin-bottom: 3mm;
  }
  .foot-url {
    display: inline-block;
    font-size: 27pt;
    font-weight: 800;
    letter-spacing: -0.005em;
    color: var(--ink);
    line-height: 1;
    text-decoration: none;
  }
  .foot-url .slash { color: var(--accent); }
  .foot-hint {
    margin-top: 5mm;
    font-size: 10pt;
    color: var(--ink-soft);
  }
  .foot-hint a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .qr {
    flex-shrink: 0;
    width: 34mm;
    height: 34mm;
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 3mm;
    padding: 3mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2mm;
    text-decoration: none;
  }
  .qr img { width: 100%; height: 100%; object-fit: contain; }
  .qr .qr-cap {
    font-size: 7.5pt;
    letter-spacing: 0.14em;
    color: var(--ink-faint);
    font-weight: 600;
  }
</style>
</head>
